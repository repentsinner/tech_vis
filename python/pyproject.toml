[project]
name = "tech_vis"
# Written by Flywheel on release, in lockstep with dart/pubspec.yaml.
# Do not edit by hand.
version = "0.4.0"
description = "Technical visualization primitives: style tokens and screen-space callout layout."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
keywords = ["visualization", "annotation", "callout", "leader-line", "technical-drawing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/repentsinner/tech_vis"
Issues = "https://github.com/repentsinner/tech_vis/issues"
Changelog = "https://github.com/repentsinner/tech_vis/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tech_vis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
