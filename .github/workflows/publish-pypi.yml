# Publishes python/ to PyPI when Flywheel pushes a release tag.
#
# Trusted Publishing (OIDC) — no API tokens. The tag points at the
# chore(release) commit, whose python/pyproject.toml already carries the
# matching version.
#
# Counterpart configuration:
# - PyPI project → Publishing: trusted publisher for repentsinner/tech_vis,
#   workflow publish-pypi.yml, environment pypi. Before the project exists,
#   register the same fields as a pending publisher.
# - GitHub Settings → Environments → pypi (required reviewers optional —
#   adds an approval click before each publish).
name: Publish to PyPI
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build sdist and wheel
        working-directory: python
        run: uv build --out-dir ../dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tech_vis
    permissions:
      id-token: write # mint the OIDC token PyPI Trusted Publishing verifies
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
