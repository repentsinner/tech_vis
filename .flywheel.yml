# Flywheel release configuration — single stream, one version.
#
# Flywheel cuts one `v<version>` tag per release; it has no per-package
# tags. Both packages therefore version in lockstep, which is also what a
# shared style wants: a token change is one release of both.
#
# `auto_merge` lists the conventional-commit types that merge without
# review. `feat`, `fix`, `perf` and every `!` variant bump the version, so
# they gate on a human: every publish to pub.dev and PyPI stays reviewed.
flywheel:
  streams:
    - name: main-line
      branches:
        - name: main
          release: production
          auto_merge: [chore, docs, style, test, ci, build, refactor]

  release_files:
    - path: dart/pubspec.yaml
      pattern: '^version: .*'
      replacement: 'version: ${version}'
    - path: python/pyproject.toml
      pattern: '^version = .*'
      replacement: 'version = "${version}"'
    # pub.dev checks that the package changelog names the version being
    # published. The notes themselves live in the root CHANGELOG.md.
    - path: dart/CHANGELOG.md
      pattern: '^Current version: .*'
      replacement: 'Current version: ${version}'
